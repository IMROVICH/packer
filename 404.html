<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>404 — Страница не найдена · IMROVICH Packer</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='7' fill='%23E0A800'/%3E%3Cpath d='M10 12h12M10 16h12M10 20h8' stroke='%231a1206' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=Unbounded:wght@500;700;900&display=swap">
<style>
:root{
  --gold:#FFD24A;--amber:#E0A800;--accent-rgb:224,168,0;--accent-light-rgb:255,210,74;
  --accent-dark-rgb:139,105,20;--glass-tint:28,20,8;--glass-border:#5C4A1E;
  --glass-border-strong:#C99B26;--bg-deep-1:#2a1e08;--bg-deep-2:#1a1206;--bg-deep-3:#0a0703;
  --on-accent:#1a1206;--text:#FFF7E0;--text-dim:#D9C79A;--text-faint:#8A7A55;
  --font-body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-display:'Unbounded','Manrope',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
html{background:var(--bg-deep-3)}
body{
  margin:0;color:var(--text);font-family:var(--font-body);line-height:1.5;
  min-height:100vh;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;padding:20px;
}
a{color:var(--gold)}
.bg-scene{
  position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(circle at 18% 8%, rgba(var(--accent-rgb), .3), transparent 34%),
    radial-gradient(circle at 82% 16%, rgba(var(--accent-light-rgb), .07), transparent 30%),
    radial-gradient(circle at 30% 85%, rgba(var(--accent-dark-rgb), .26), transparent 40%),
    linear-gradient(145deg, var(--bg-deep-1), var(--bg-deep-2) 52%, var(--bg-deep-3));
}
.fireflies{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.firefly-wrap{position:absolute;bottom:-5%;opacity:0;animation-name:flyUp;animation-timing-function:linear;animation-iteration-count:infinite}
.firefly{
  display:block;width:var(--fs,3px);height:var(--fs,3px);border-radius:50%;
  background:radial-gradient(circle, rgba(var(--accent-light-rgb), .95), rgba(var(--accent-rgb), .35) 60%, transparent 72%);
  box-shadow:0 0 5px 1.5px rgba(var(--accent-light-rgb), .4), 0 0 10px 3px rgba(var(--accent-rgb), .2);
}
.f1{left:10%;--fs:3px;animation-duration:11s;animation-delay:0s}
.f2{left:28%;--fs:2.5px;animation-duration:14s;animation-delay:2s}
.f3{left:50%;--fs:3.5px;animation-duration:9s;animation-delay:4s}
.f4{left:70%;--fs:2.5px;animation-duration:13s;animation-delay:1s}
.f5{left:88%;--fs:3px;animation-duration:12s;animation-delay:3s}
@keyframes flyUp{
  0%{transform:translateY(0) translateX(0);opacity:0}
  10%{opacity:1}90%{opacity:1}
  100%{transform:translateY(-110vh) translateX(30px);opacity:0}
}
.wrap{position:relative;z-index:1;max-width:640px;width:100%;text-align:center;animation:fadeIn .8s cubic-bezier(.2,.7,.3,1) both}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.icon-404{
  display:inline-block;font-size:clamp(2.5rem,7vw,4rem);margin-bottom:20px;
  filter:drop-shadow(0 0 24px rgba(var(--accent-rgb), .5));
  animation:iconFloat 3s ease-in-out infinite;
}
@keyframes iconFloat{
  0%,100%{transform:translateY(0) rotate(-3deg)}
  50%{transform:translateY(-10px) rotate(3deg)}
}
.code-404{
  font-family:var(--font-display);font-size:clamp(6rem,22vw,14rem);font-weight:900;
  line-height:.9;margin:0 0 12px;letter-spacing:-.04em;
  background:linear-gradient(180deg,#FFE9A8 0%,#FFD24A 40%,#E0A800 80%,#8B6914 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 40px rgba(var(--accent-rgb), .4)) drop-shadow(0 8px 24px rgba(0,0,0,.6));
  animation:codeFloat 4s ease-in-out infinite;user-select:none;
}
@keyframes codeFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.title{font-family:var(--font-display);font-size:clamp(1.3rem,3.5vw,1.9rem);font-weight:700;margin:0 0 12px;color:var(--text)}
.subtitle{color:var(--text-dim);font-size:1rem;margin:0 0 8px;line-height:1.6}
.url-show{
  display:inline-block;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:.8rem;padding:6px 14px;border-radius:999px;background:rgba(0,0,0,.35);
  border:1px solid var(--glass-border);color:var(--gold);margin:14px 0 28px;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle;
}
.actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:28px}
.btn{
  padding:14px 30px;border-radius:999px;font-weight:700;font-size:.95rem;
  cursor:pointer;transition:all .25s cubic-bezier(.2,.7,.3,1);border:none;font-family:inherit;
  text-decoration:none;display:inline-flex;align-items:center;gap:8px;position:relative;overflow:hidden;
}
.btn-primary{
  background:linear-gradient(135deg, var(--amber), var(--gold));color:var(--on-accent);
  box-shadow:0 4px 14px rgba(var(--accent-rgb), .35);
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(var(--accent-rgb), .5)}
.btn-primary:active{transform:translateY(0)}
.btn-ghost{background:transparent;color:var(--text-dim);border:1px solid var(--glass-border)}
.btn-ghost:hover{border-color:var(--gold);color:var(--text);transform:translateY(-2px)}
.countdown{color:var(--text-faint);font-size:.85rem;min-height:1.5em}
.countdown b{color:var(--gold);font-weight:700}
.countdown .cancel{
  background:none;border:none;color:var(--gold);font-family:inherit;font-size:inherit;
  cursor:pointer;text-decoration:underline;padding:0 4px;transition:color .2s;
}
.countdown .cancel:hover{color:#fff}
.brand{
  display:inline-flex;align-items:center;gap:10px;margin-top:36px;padding:10px 18px;
  border-radius:999px;background:rgba(var(--glass-tint), .6);border:1px solid var(--glass-border);
  backdrop-filter:blur(10px);text-decoration:none;color:var(--text-dim);font-size:.85rem;
  transition:all .25s;
}
.brand:hover{border-color:var(--gold);color:var(--text);transform:translateY(-2px)}
.brand svg{width:22px;height:22px;flex-shrink:0;transition:transform .4s}
.brand:hover svg{transform:rotate(-8deg)}
.brand b{color:var(--gold);font-weight:700;font-family:var(--font-display);font-size:.9rem}
@media (max-width:500px){
  .code-404{font-size:clamp(5rem,28vw,8rem)}
  .btn{padding:12px 22px;font-size:.9rem}
  .actions{flex-direction:column;align-items:stretch}
  .btn{justify-content:center}
}
</style>
</head>
<body>
<div class="bg-scene" aria-hidden="true"></div>
<div class="fireflies" aria-hidden="true">
  <span class="firefly-wrap f1"><span class="firefly"></span></span>
  <span class="firefly-wrap f2"><span class="firefly"></span></span>
  <span class="firefly-wrap f3"><span class="firefly"></span></span>
  <span class="firefly-wrap f4"><span class="firefly"></span></span>
  <span class="firefly-wrap f5"><span class="firefly"></span></span>
</div>

<main class="wrap">
  <div class="icon-404">🧭</div>
  <h1 class="code-404">404</h1>
  <h2 class="title">Страница не найдена</h2>
  <p class="subtitle">Такого адреса здесь нет — возможно, ссылка устарела или её никогда не существовало.</p>
  <div class="url-show" id="urlShow" title="Запрошенный URL"></div>

  <div class="actions">
    <a href="/packer/" class="btn btn-primary" id="goHomeBtn">
      <span>🏠</span>
      <span>На главную</span>
    </a>
    <button type="button" class="btn btn-ghost" id="backBtn">
      <span>←</span>
      <span>Назад</span>
    </button>
  </div>

  <div class="countdown" id="countdown"></div>

  <a href="/packer/" class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="3" width="26" height="26" rx="7" fill="url(#grad404)"/><path d="M10 12h12M10 16h12M10 20h8" stroke="#1a1206" stroke-width="2.2" stroke-linecap="round"/><defs><linearGradient id="grad404" x1="3" y1="3" x2="29" y2="29"><stop stop-color="#E0A800"/><stop offset="1" stop-color="#FFD24A"/></linearGradient></defs></svg>
    <span><b>IMROVICH</b> Packer</span>
  </a>
</main>

<script>
(function(){
  'use strict';
  try{
    var urlEl=document.getElementById('urlShow');
    if(urlEl){
      var p=location.pathname||'/';
      var q=location.search||'';
      urlEl.textContent=p+q;
      urlEl.title=location.href;
    }
  }catch(e){}

  var goHome=document.getElementById('goHomeBtn');
  if(goHome){
    var path=location.pathname||'/';
    var base=path.indexOf('/packer/')===0?'/packer/':'/';
    goHome.setAttribute('href',base);
  }

  var backBtn=document.getElementById('backBtn');
  if(backBtn){
    backBtn.addEventListener('click',function(){
      if(window.history.length>1){window.history.back();}
      else{location.href=(location.pathname||'/').indexOf('/packer/')===0?'/packer/':'/';}
    });
  }

  var seconds=5;
  var cancelled=false;
  var el=document.getElementById('countdown');
  var timerId=null;

  function render(){
    if(!el)return;
    if(cancelled){el.innerHTML='Авто-переход отменён. Можешь остаться здесь.';return;}
    if(seconds<=0){
      el.innerHTML='Переходим на главную…';
      var base=(location.pathname||'/').indexOf('/packer/')===0?'/packer/':'/';
      location.replace(base);
      return;
    }
    el.innerHTML='Переход на главную через <b>'+seconds+'</b> сек. <button type="button" class="cancel" id="cancelRedirect">Отменить</button>';
    var btn=document.getElementById('cancelRedirect');
    if(btn){
      btn.addEventListener('click',function(){
        cancelled=true;
        if(timerId){clearInterval(timerId);timerId=null;}
        render();
      });
    }
  }

  function tick(){
    if(cancelled)return;
    seconds--;
    render();
    if(seconds<=0){if(timerId){clearInterval(timerId);timerId=null;}}
  }

  render();
  timerId=setInterval(tick,1000);

  document.addEventListener('keydown',function(e){
    if(e.key==='Enter'){
      var base=(location.pathname||'/').indexOf('/packer/')===0?'/packer/':'/';
      location.href=base;
    }else if(e.key==='Escape'){
      cancelled=true;
      if(timerId){clearInterval(timerId);timerId=null;}
      render();
    }
  });
})();
</script>
</body>
</html>
